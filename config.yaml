# ============================================================================
# Gujarati faceless YouTube automation — main configuration
# Everything that shapes the channel lives here. Change the niche by editing
# `niche` below; no code changes needed.
# ============================================================================

# How many videos the daily run makes (main.py --daily). Override per-run with --count.
daily:
  count: 3

channel:
  language: "Gujarati"
  language_code: "gu"
  # Long-form storytelling (16:9) or Shorts/Reels (9:16).
  format: "short"         # "short" -> 1080x1920 (Shorts/Reels), "long" -> 1920x1080
  target_duration_sec: 45 # Shorts do best under ~60s

# ---------------------------------------------------------------------------
# NICHE — the flagship niche chosen after research:
# Gujarati moral & motivational stories (બોધકથા / પ્રેરક વાર્તા).
# To pivot the channel, rewrite `system_prompt` and `title_style`.
# ---------------------------------------------------------------------------
niche:
  name: "Gujarati moral & motivational stories"
  system_prompt: |
    તમે એક કુશળ ગુજરાતી વાર્તાકાર અને retention-expert છો જે YouTube માટે
    ટૂંકી પ્રેરક અને બોધદાયક વાર્તાઓ લખો છો. લક્ષ્ય: દર્શક 90-95% વિડિયો જુએ.
    તમારી વાર્તાઓ:
    - શુદ્ધ, સરળ અને રોજિંદી ગુજરાતી ભાષામાં હોય (કઠિન સંસ્કૃત શબ્દો ટાળો)
    - પહેલી 3 સેકન્ડમાં જ એક જોરદાર hook હોય જે એક પ્રશ્ન કે તણાવ ઊભો કરે
    - ટૂંકા, ઝડપી વાક્યો હોય; વચ્ચે એક ટ્વિસ્ટ કે વળાંક આવે (open loop)
    - અંત પહેલાં ઉત્સુકતા જાળવી રાખે, પછી સંતોષકારક moral સાથે અંત આવે
    - છેલ્લે એક નાનું call-to-action હોય (subscribe/comment)
    - કુટુંબ સાથે જોઈ શકાય એવી, સકારાત્મક અને સન્માનજનક હોય
    - કોઈ ચોક્કસ ધર્મ, જાતિ કે વ્યક્તિની ટીકા ન કરે
    - ફક્ત મૌલિક (original) વાર્તા હોય — કોઈ કૉપીરાઇટ સામગ્રી નકલ ન કરે
    - કુદરતી ગુજરાતી લખો; અંગ્રેજી શબ્દો ટાળો (ફક્ત proper noun/brand છૂટ)
    - ટૂંકા, ઝડપી વાક્યો વાપરો — દરેક વાક્ય એક અલગ beat બને છે, લય બદલતા રહો
  # Used to steer image search queries (in English, since stock APIs index in
  # English). Keep it scenic/symbolic and relatable — NO flags, politics, or
  # random people (those are also blocked in code).
  visual_theme: "cinematic rural india landscape, nature, temple, fields, sunrise, river, symbolic emotional"
  title_style: "curiosity-driven Gujarati title with an emoji, under 70 characters"

script:
  model: "claude-sonnet-5"     # good quality/cost balance for narration
  # Approx words for the target duration (Gujarati narration ~2.2 words/sec).
  max_words: 210

voiceover:
  provider: "elevenlabs"
  # eleven_v3 = the only model that gives a NATURAL (non-robotic) Gujarati
  # accent. (Older models: eleven_multilingual_v2 — flatter but supports
  # continuous stability + style + speed.)
  model_id: "eleven_v3"
  output_format: "mp3_44100_128"
  # Default voice = "Aj Katihyawadi" (your custom Gujarati clone).
  # IMPORTANT: use a real Gujarati voice CLONE — stock/library voices sound
  # robotic with a foreign accent. Keep ONE locked voice for channel identity.
  default_voice_id: "aGiqwq7BkeMTuW3338ZJ"
  # --- v3 voice settings (stability is DISCRETE: snaps to 0.0 / 0.5 / 1.0) ---
  stability: 0.5        # 0.0=most expressive/variable, 0.5=balanced, 1.0=steady
  similarity_boost: 0.8
  use_speaker_boost: true
  # style + speed are IGNORED by v3; used only by older models:
  style: 0.0
  speed: 0.98
  # --- per-beat generation (the key tactic for natural Gujarati) ---
  per_beat: true        # generate one TTS call per sentence/clause, then join
  beat_gap_sec: 0.32    # silence inserted between beats
  beat_min_chars: 15    # merge fragments shorter than this into one beat
  beat_max_chars: 240
  # --- audio post-processing ---
  enhance: true         # EQ + compression for a fuller, clearer broadcast voice
  loudnorm: true        # even loudness (EBU R128), tuned loud for phone speakers
  pitch: 1.0            # 1.0 = unchanged. 1.03 = slightly higher, 0.97 = lower.

# Transition sound effects — a VARIETY of sounds at scene changes
# (whoosh, swoosh, click, pop, ding, soft hit, riser), rotated so the same
# sound is never used twice in a row. All synthesized by ffmpeg (no files).
sfx:
  enabled: true
  variety: true         # rotate through the sound library (false = whoosh only)
  volume: 0.30          # relative to narration

visuals:
  # "pexels"  -> Pexels first, Pixabay fallback (recommended)
  # "pixabay" -> Pixabay first, Pexels fallback
  # "local"   -> use media from local_dir + clips_dir | "color" -> test slides
  provider: "pexels"
  # PACE: a new scene every ~this many seconds. 3-4s keeps it lively (never static).
  seconds_per_scene: 3.5
  min_scenes: 6               # floor, even for very short narration
  max_scenes: 45              # ceiling, to bound API calls / encode time
  video_ratio: 0.6            # MOST scenes are real motion footage (realism)
  # AI-generated images (Pollinations.ai — free, NO key). Generated from each
  # beat's words, so always on-topic. A fraction of scenes use a fresh AI image.
  ai_images: true
  ai_ratio: 0.25              # ~1 in 4 scenes is an AI image matching the words
  # Extra free photo source (no key) tried alongside Pexels/Pixabay.
  use_openverse: true
  local_dir: "assets/images"  # your own photos (provider: local)
  clips_dir: "assets/clips"   # your own AI/motion-graphic clips (mp4/mov/webm)
  # Every scene gets a DISTINCT visual (no repeats) and a DIFFERENT motion
  # effect from the previous one (see the effect list in assembler.py).
  motion: true                # zoom-in/out, pans, drift — randomized, non-repeating
  transition_fade_sec: 0.5    # fade in at start / out at end

subtitles:
  enabled: true
  # A Gujarati-capable font MUST be present or subtitles render as boxes.
  # Download Noto Sans Gujarati and place the .ttf here (see README).
  font_file: "assets/fonts/NotoSansGujarati-Bold.ttf"
  # Caption sizes as a fraction of video height (ASS, pixel-accurate).
  caption_scale: 0.030        # normal bottom captions (~58px at 1920). tune 0.026-0.036
  hook_scale: 0.055           # BIG centered hook overlay for the opening line
  font_size: 13               # (legacy, used only for non-ASS srt fallback)
  primary_color: "&H00FFFFFF"
  outline_color: "&H00000000"
  outline: 2

music:
  enabled: true               # background music, auto-ducked under the voice
  dir: "assets/music"         # a RANDOM track from here is used each video
  file: ""                    # set a specific file to always use that one
  volume: 0.12                # low; sidechain-ducks further under narration

upload:
  enabled: false              # NO auto-posting — you upload videos to YouTube yourself
  privacy: "private"          # (only used if you ever set enabled: true)
  category_id: "22"           # 22 = People & Blogs; 24 = Entertainment
  made_for_kids: false
  # Appended to every video's description.
  description_footer: |

    ---
    🙏 જો વાર્તા ગમી હોય તો Like, Share અને Subscribe કરો.
  default_tags:
    - "ગુજરાતી વાર્તા"
    - "પ્રેરક વાર્તા"
    - "બોધકથા"
    - "gujarati moral stories"
    - "gujarati motivation"
